<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diagram diff prototype</title>
  <link rel="icon" href="./favicon.ico" sizes="48x48" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#061958" />
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dde1e7; --text: #1d2330; --muted: #667085;
      --accent: #2b5bd7;
      --add: #1a7f37; --add-bg: #dafbe1;
      --del: #cf222e; --del-bg: #ffebe9;
      --content: #b35900; --content-bg: #fff1e0;
      --layout: #0969da; --layout-bg: #ddf4ff;
      --style: #8250df; --style-bg: #fbefff;
      color-scheme: light;
      /* chrome tokens of the components (src/ui/styles/base.ts) */
      --ds-font: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --ds-accent: #4f46e5; --ds-accent-2: #eef0ff; --ds-surface: #ffffff; --ds-surface-2: #f2f3f7;
      --ds-border: #dde1e7; --ds-text: #1d2330; --ds-muted: #6b7385; --ds-faint: #b0b6c3;
      --ds-float: #ffffff; --ds-float-2: #f2f3f7; --ds-float-line: rgba(0,0,0,.06);
      --ds-radius: 8px; --ds-radius-sm: 6px;
      --ds-shadow: 0 2px 8px rgba(0,0,0,.08); --ds-shadow-lg: 0 8px 28px rgba(0,0,0,.16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--text); background: var(--bg); }
    body { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .grow { flex: 1; }
    .muted { color: var(--muted); }

    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 15px; margin: 0 8px 0 0; }
    header select, header > button { height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 0 8px; }
    #sample-note { color: var(--muted); }


    /* layout: the canvas fills the page; the code and change panels float over it like the editor's panels */
    #main {
      position: relative; min-height: 0; overflow: hidden; background: var(--surface);
      --left-w: 460px; --right-w: 360px;
      --inset-l: calc(var(--left-w) + 24px); --inset-r: calc(var(--right-w) + 24px);
    }
    #main[data-left=""] { --inset-l: 0px; }
    #main.no-changes { --inset-r: 0px; }
    #stage { position: absolute; top: 0; bottom: 0; left: var(--inset-l); right: var(--inset-r); transition: left .24s cubic-bezier(.2,.8,.2,1), right .24s cubic-bezier(.2,.8,.2,1); }
    #main.resizing-panes #stage { transition: none; }
    #main.resizing-panes, #main.resizing-panes * { cursor: col-resize !important; user-select: none !important; }
    .pane-side {
      position: absolute; top: 12px; bottom: 12px; z-index: 30; display: flex; flex-direction: column; min-height: 0;
      background: var(--ds-surface); border: 1px solid var(--ds-border); border-radius: 14px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(20, 30, 60, .16), 0 1px 3px rgba(20, 30, 60, .08);
      transition: transform .24s cubic-bezier(.2,.8,.2,1), opacity .24s;
    }
    .pane-side.left { left: 12px; width: var(--left-w); }
    .pane-side.right { right: 12px; bottom: 60px; width: var(--right-w); }
    #main:not([data-left="code"]) #code-pane, #main:not([data-left="history"]) #history-pane { transform: translateX(calc(-100% - 24px)); opacity: .4; pointer-events: none; }

    /* history */
    .history-cmp { padding: 8px 14px; font-size: 12px; color: var(--ds-muted); border-bottom: 1px solid var(--ds-border); background: var(--ds-surface-2); position: sticky; top: 0; z-index: 1; }
    .history-cmp b { color: var(--ds-text); font-weight: 600; }
    .versions { display: flex; flex-direction: column; padding: 6px; gap: 2px; }
    .version { position: relative; border-radius: 8px; }
    .version:hover { background: var(--ds-surface-2); }
    .version.viewing { background: var(--ds-accent-2); box-shadow: inset 3px 0 0 var(--ds-accent); }
    .version.base { box-shadow: inset 3px 0 0 var(--del); background: #fff6f5; }
    .version-main { display: grid; gap: 3px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px 8px 14px; border-radius: 8px; }
    .vhead { display: flex; gap: 6px; align-items: center; }
    .vnum { font-size: 12px; font-variant-numeric: tabular-nums; }
    .vtag { font-size: 10.5px; font-weight: 600; border-radius: 4px; padding: 0 5px; line-height: 16px; }
    .vtag.current { background: var(--ds-surface-2); color: var(--ds-text); box-shadow: inset 0 0 0 1px var(--ds-border); }
    .vtag.after { background: var(--add-bg); color: var(--add); }
    .vtag.before { background: var(--del-bg); color: var(--del); }
    .vmsg { font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .vmeta { display: flex; justify-content: space-between; gap: 8px; color: var(--ds-muted); font-size: 11.5px; }
    .vstats { display: flex; gap: 6px; font-variant-numeric: tabular-nums; font-weight: 600; }
    .vstats .add { color: var(--add); } .vstats .del { color: var(--del); } .vstats .chg { color: var(--content); }
    .vbase { position: absolute; right: 8px; top: 7px; display: none; border: 1px solid var(--ds-border); background: var(--ds-surface); border-radius: 6px; padding: 1px 8px; font-size: 11.5px; }
    .version:hover .vbase, .vbase:focus-visible { display: block; }
    .vbase:hover { border-color: var(--ds-accent); color: var(--ds-accent); }
    #main.no-changes .pane-side.right { transform: translateX(calc(100% + 24px)); opacity: .4; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .pane-side, #stage { transition: none !important; } }
    .pane-resizer { position: absolute; top: 14px; bottom: 14px; width: 7px; z-index: 31; cursor: col-resize; touch-action: none; }
    .pane-resizer::after { content: ''; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: transparent; transition: background .12s; }
    .pane-resizer:hover::after, .pane-resizer.dragging::after { background: var(--ds-accent); width: 2px; left: 2px; }
    .pane-side.left .pane-resizer { right: 0; }
    .pane-side.right .pane-resizer { left: 0; }
    .pane-side .tabs { display: flex; border-bottom: 1px solid var(--ds-border); flex-shrink: 0; }
    .pane-side .tabs [role=tab] { border: 0; border-radius: 0; padding: 9px 12px; color: var(--ds-muted); border-bottom: 2px solid transparent; background: none; }
    .pane-side .tabs [role=tab][aria-selected=true] { color: var(--ds-text); border-bottom-color: var(--ds-accent); font-weight: 600; }
    .tabs-spacer { flex: 1; }
    .pane-side .collapse-btn { border: 0; background: none; padding: 2px 10px; color: var(--ds-muted); font-size: 18px; line-height: 1; border-radius: 6px; }
    .pane-side .collapse-btn:hover { color: var(--ds-text); background: var(--ds-surface-2); }
    .tab-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .rp-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 6px 8px 14px; border-bottom: 1px solid var(--ds-border); flex: none; }
    .rp-head b { font-size: 13px; }
    .rp-body { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; }

    /* help: the editor's help popup */
    .zoombar .help-btn { font-weight: 600; }
    .zoombar .help-btn[aria-expanded=true] { color: var(--ds-accent); }
    .help-pop { position: absolute; right: 12px; bottom: 56px; z-index: 50; width: 420px; max-width: calc(100% - 24px); max-height: min(600px, calc(100% - 80px)); display: flex; flex-direction: column;
      background: var(--ds-surface); border: 1px solid var(--ds-border); border-radius: var(--ds-radius); box-shadow: var(--ds-shadow-lg); }
    .help-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 6px 14px; }
    .help-head b { font-size: 13px; }
    .help-head button { border: 0; background: none; font-size: 18px; line-height: 1; padding: 2px 8px; border-radius: 6px; color: var(--ds-muted); }
    .help-head button:hover { background: var(--ds-float-2); color: var(--ds-text); }
    .help-body { overflow: auto; padding: 0 14px 12px; }
    .help-title { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ds-muted); margin: 10px 0 4px; }
    .help-row { display: grid; grid-template-columns: minmax(0, 110px) minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 4px 0; line-height: 1.45; }
    .help-row + .help-row { border-top: 1px solid var(--ds-float-line); }
    .help-keys { color: var(--ds-muted); font-size: 11px; min-width: 0; }
    .help-keys kbd { font: 11px/1 ui-monospace, Menlo, monospace; color: var(--ds-text); background: var(--ds-float-2); border: 1px solid var(--ds-float-line); border-radius: 5px; padding: 2px 5px; white-space: nowrap; }
    .help-gesture { color: var(--ds-text); font-size: 11.5px; }

    /* tool panel (pan, pen): the viewer's bar style (src/ui/styles/viewer.ts), on the left */
    .vbar-wrap { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); z-index: 4; display: flex; align-items: center; gap: 8px; pointer-events: none; }
    .vbar-wrap > * { pointer-events: auto; }
    .vbar { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 3px; }
    .vbar button { border: 0; background: transparent; padding: 4px 7px; border-radius: 5px; min-width: 28px; min-height: 28px; display: inline-flex; align-items: center; justify-content: center; color: var(--ds-text); font-size: 13px; }
    .vbar button:hover:not(:disabled) { background: var(--ds-float-2); }
    .vbar button.on { background: var(--ds-accent-2); color: var(--ds-accent); }
    .vbar .sep { height: 1px; align-self: stretch; margin: 3px 4px; background: var(--ds-border); }
    .vbar button { position: relative; }
    /* hover tooltips (icons only in the bar) */
    .vbar [data-tip]:hover::after {
      content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); z-index: 60;
      white-space: nowrap; background: #1d2330; color: #fff; font-size: 12px; font-weight: 500; padding: 4px 8px; border-radius: 6px;
      box-shadow: var(--ds-shadow); pointer-events: none;
    }
    .vbar-wrap:has(.pen-opts) [data-tip]:hover::after { display: none; }
    /* bottom panel: views, change filters, dim (the same bar style, horizontal) */
    .dbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 4; display: flex; gap: 2px; align-items: center; padding: 3px; white-space: nowrap; }
    .dbar button { position: relative; border: 0; background: transparent; padding: 4px 7px; border-radius: 5px; min-width: 28px; min-height: 28px; display: inline-flex; align-items: center; justify-content: center; color: var(--ds-text); font-size: 13px; }
    .dbar button:hover:not(:disabled) { background: var(--ds-float-2); }
    .dbar button.on { background: var(--ds-accent-2); color: var(--ds-accent); }
    .dbar button.view { padding: 4px 10px; }
    .dbar button.view.on { font-weight: 600; }
    .dbar button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ds-accent); }
    .dbar .sep { width: 1px; align-self: stretch; margin: 3px 4px; background: var(--ds-border); }
    .dbar [data-tip]:hover::after {
      content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); z-index: 60;
      width: max-content; max-width: 280px; white-space: normal; text-align: left; background: #1d2330; color: #fff; font-size: 12px; font-weight: 500; line-height: 1.4; padding: 5px 9px; border-radius: 6px;
      box-shadow: var(--ds-shadow); pointer-events: none;
    }
    /* change filters: coloured like their highlights; off = struck through */
    .dbar .flt { color: var(--c); }
    .dbar .flt.on { background: var(--c-bg); color: var(--c); }
    .dbar .flt.off { color: var(--ds-faint); }
    .dbar .flt.off::before { content: ''; position: absolute; left: 6px; right: 6px; top: 50%; height: 1.5px; background: var(--ds-faint); transform: rotate(-45deg); }
    .dbar .flt-added { --c: var(--add); --c-bg: var(--add-bg); }
    .dbar .flt-removed { --c: var(--del); --c-bg: var(--del-bg); }
    .dbar .flt-content { --c: var(--content); --c-bg: var(--content-bg); }
    .dbar .flt-layout { --c: var(--layout); --c-bg: var(--layout-bg); }
    .dbar .flt-style { --c: var(--style); --c-bg: var(--style-bg); }
    .dbar .cnt { position: absolute; right: -3px; bottom: -2px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--c, var(--ds-muted)); color: #fff; font-size: 9px; font-weight: 700; line-height: 14px; text-align: center; }
    .dbar .flt.off .cnt { background: var(--ds-faint); }
    .vbar button:focus-visible, .pen-opts button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ds-accent); }
    .ds-float { background: var(--ds-float); border: 1px solid var(--ds-float-line); border-radius: var(--ds-radius); box-shadow: var(--ds-shadow); }
    .ds-icon { display: block; flex-shrink: 0; }
    .ds-sect { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ds-muted); padding: 6px 10px 2px; }
    .pen-opts { display: flex; flex-direction: column; gap: 8px; padding: 6px 8px; box-shadow: var(--ds-shadow-lg); border-color: var(--ds-border); background: var(--ds-surface); }
    .pen-opts .line { display: flex; gap: 6px; align-items: center; }
    .pen-opts .ds-sect { padding: 0 4px 0 0; }
    .pen-opts button { border: 1px solid var(--ds-border); background: var(--ds-surface); border-radius: var(--ds-radius-sm); padding: 4px 10px; color: var(--ds-text); line-height: 1.3; }
    .pen-opts button:hover:not(:disabled) { border-color: var(--ds-faint); }
    .pen-opts button:disabled { opacity: .45; cursor: default; }
    .pen-opts .swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
    .pen-opts .swatch[aria-pressed=true] { border-color: var(--ds-text); }
    .pen-opts .size { width: 26px; height: 26px; display: inline-grid; place-items: center; padding: 0; }
    .pen-opts .size i { display: block; border-radius: 50%; background: currentColor; }
    .pen-opts .size[aria-pressed=true], .pen-opts .fade[aria-pressed=true] { background: var(--ds-accent-2); color: var(--ds-accent); border-color: transparent; }
    .stage.tool-draw .pane { cursor: crosshair; }
    .ink { pointer-events: none; }
    .ink-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .9; transition: opacity .6s; }
    .ink-stroke.ink-fading { opacity: 0; }

    /* ---- stage ---- */
    .stage { position: relative; display: flex; gap: 1px; background: var(--border); min-height: 0; min-width: 0; }
    .pane { position: relative; flex: 1; min-width: 0; background: var(--surface); overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    .pane.panning { cursor: grabbing; }
    .pane > svg, .layer > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .layer { position: absolute; inset: 0; }
    .layer-after { background: var(--surface); }
    .pane-title { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: baseline; pointer-events: none; z-index: 2; }
    .pane-title b { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 1px 8px; font-size: 12px; }
    .pane-title span { color: var(--muted); font-size: 12px; }
    .pane.before .pane-title b { color: var(--del); }
    .pane.after .pane-title b, .pane.single .pane-title b { color: var(--add); }
    .pane-title b.cmp { color: var(--ds-text); font-weight: 600; }

    .swipe-handle { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); cursor: ew-resize; z-index: 3; }
    .swipe-handle span { position: absolute; top: 50%; left: -15px; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; box-shadow: 0 2px 6px #0003; }
    .swipe-handle::before { content: ''; position: absolute; inset: 0 -10px; }
    .onion { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; box-shadow: 0 2px 8px #0002; z-index: 3; }
    .onion input { width: 220px; }

    .zoombar { position: absolute; right: 12px; bottom: 12px; display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--surface); box-shadow: 0 1px 4px #0001; z-index: 3; }
    .zoombar button { border: 0; background: none; padding: 4px 10px; min-width: 32px; border-right: 1px solid var(--border); }
    .zoombar button:last-child { border-right: 0; }

    /* morph */
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--surface-2); }
    .seg button { border: 0; background: none; padding: 5px 11px; border-right: 1px solid var(--border); }
    .seg button:last-child { border-right: 0; }
    .seg button.on { background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
    .morph-steps button { min-width: 72px; }
    .mx-flip { transform-box: fill-box; transform-origin: center; }

    /* word-level text changes */
    .dx-ins { fill: var(--add); font-weight: 700; }
    .dx-del { fill: var(--del); text-decoration: line-through; }
    .dx-runs { pointer-events: none; }
    .dx-runs rect { mix-blend-mode: multiply; }
    .dx-runs .run-ins { fill: #aff5b4; }
    .dx-runs .run-del { fill: #ffd2cf; }
    .dx-gone { opacity: .6; }

    /* highlights inside the SVG */
    .dx-dim { opacity: 0.28; transition: opacity .2s; }
    .dx-hl { pointer-events: visiblePainted; cursor: pointer; }
    .dx-outline { fill: var(--c-bg); fill-opacity: .6; stroke: var(--c); stroke-width: 2.5px; vector-effect: non-scaling-stroke; mix-blend-mode: multiply; }
    .dx-stroke { fill: none; stroke: var(--c); stroke-width: 9; stroke-opacity: .35; stroke-linecap: round; stroke-linejoin: round; mix-blend-mode: multiply; }
    .dx-dashed .dx-outline { stroke-dasharray: 7 5; }
    .dx-badge { transform: scale(var(--dx-inv, 1)); }
    .dx-badge rect { fill: var(--c); stroke: #fff; stroke-width: 1.5px; }
    .dx-badge text { fill: #fff; font: 700 10.5px system-ui, sans-serif; letter-spacing: .02em; }
    .dx-added { --c: var(--add); --c-bg: var(--add-bg); }
    .dx-removed { --c: var(--del); --c-bg: var(--del-bg); }
    .dx-content { --c: var(--content); --c-bg: var(--content-bg); }
    .dx-layout { --c: var(--layout); --c-bg: var(--layout-bg); }
    .dx-style { --c: var(--style); --c-bg: var(--style-bg); }
    .dx-hl.dx-selected .dx-outline { stroke-width: 4.5px; fill-opacity: .9; animation: dx-pulse 1.2s ease-in-out 2; }
    .dx-hl.dx-selected .dx-stroke { stroke-opacity: .6; stroke-width: 13; }
    @keyframes dx-pulse { 50% { stroke-width: 9px; } }
    .dx-ghosts { opacity: .45; }
    .dx-was { fill: none; stroke: var(--layout); stroke-width: 2px; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
    .dx-arrow { stroke: var(--layout); stroke-width: 2px; vector-effect: non-scaling-stroke; }
    .dx-arrowhead { fill: var(--layout); }

    /* ---- code diff panel ---- */
    .code-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--ds-border); flex: none; }
    .code-scroll { flex: 1; overflow: auto; min-height: 0; }
    .stat { font-weight: 700; }
    .stat.add { color: var(--add); } .stat.del { color: var(--del); }
    .code-note { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--layout-bg); color: #0a3069; }
    table.code { border-collapse: collapse; width: 100%; font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    table.code td { padding: 0 8px; white-space: pre; vertical-align: top; }
    table.code td.num { width: 1%; color: var(--muted); text-align: right; user-select: none; }
    table.code td.sign { width: 1%; user-select: none; }
    table.code td.txt { white-space: pre-wrap; word-break: break-all; }
    .ln-add { background: var(--add-bg); } .ln-add .sign { color: var(--add); }
    .ln-del { background: var(--del-bg); } .ln-del .sign { color: var(--del); }
    tr.skip td { background: var(--surface-2); padding: 0; }
    tr.skip button { border: 0; background: none; color: var(--accent); width: 100%; text-align: left; padding: 3px 12px; font: 12px system-ui, sans-serif; }

    /* ---- side panel ---- */
    .summary { padding: 12px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 2px 10px; display: inline-flex; gap: 6px; align-items: center; }
    .chip b { font-weight: 700; }
    .chip.on { background: var(--text); color: #fff; border-color: var(--text); }
    .chip.st-added b { color: var(--add); } .chip.st-removed b { color: var(--del); } .chip.st-changed b { color: var(--content); }
